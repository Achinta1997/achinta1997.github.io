<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 520" role="img" aria-labelledby="svgTitle svgDesc">
  <title id="svgTitle">Developer at a desk</title>
  <desc id="svgDesc">A flat illustration of a developer with headphones sitting at a desk, typing in front of a monitor that shows code.</desc>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1729" />
      <stop offset="1" stop-color="#070b14" />
    </linearGradient>

    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#22d3ee" stop-opacity=".34" />
      <stop offset=".65" stop-color="#22d3ee" stop-opacity=".08" />
      <stop offset="1" stop-color="#22d3ee" stop-opacity="0" />
    </radialGradient>

    <linearGradient id="hoodie" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4f8ef7" />
      <stop offset="1" stop-color="#2f6fe0" />
    </linearGradient>

    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0v40" fill="none" stroke="#7dd3fc" stroke-opacity=".055" />
    </pattern>

    <style><![CDATA[
      .float-a, .float-b, .float-c, .float-d {
        transform-box: fill-box;
        transform-origin: center;
        animation: floaty 7s ease-in-out infinite;
      }
      .float-b { animation-duration: 9s; animation-delay: -2s; }
      .float-c { animation-duration: 8s; animation-delay: -4s; }
      .float-d { animation-duration: 6s; animation-delay: -1s; }

      @keyframes floaty {
        0%, 100% { transform: translateY(0); }
        50% { transform: translateY(-9px); }
      }

      .glow {
        transform-box: fill-box;
        transform-origin: center;
        animation: breathe 6s ease-in-out infinite;
      }
      @keyframes breathe {
        0%, 100% { opacity: .72; }
        50% { opacity: 1; }
      }

      .person {
        transform-box: fill-box;
        transform-origin: bottom center;
        animation: bob 4.5s ease-in-out infinite;
      }
      @keyframes bob {
        0%, 100% { transform: translateY(0); }
        50% { transform: translateY(-2.5px); }
      }

      .cursor { animation: blink 1.1s steps(1) infinite; }
      @keyframes blink { 50% { opacity: 0; } }

      .code-line { animation: linePulse 5s ease-in-out infinite; }
      .code-line:nth-of-type(2) { animation-delay: .6s; }
      .code-line:nth-of-type(3) { animation-delay: 1.2s; }
      .code-line:nth-of-type(4) { animation-delay: 1.8s; }
      .code-line:nth-of-type(5) { animation-delay: 2.4s; }
      .code-line:nth-of-type(6) { animation-delay: 3s; }
      @keyframes linePulse {
        0%, 100% { opacity: .78; }
        50% { opacity: 1; }
      }

      .steam {
        transform-box: fill-box;
        transform-origin: center;
        opacity: 0;
        animation: steamRise 3.6s ease-out infinite;
      }
      .steam:nth-of-type(2) { animation-delay: 1.2s; }
      @keyframes steamRise {
        0% { opacity: 0; transform: translateY(4px); }
        30% { opacity: .5; }
        100% { opacity: 0; transform: translateY(-14px); }
      }

      @media (prefers-reduced-motion: reduce) {
        .float-a, .float-b, .float-c, .float-d,
        .glow, .person, .cursor, .code-line, .steam {
          animation: none;
        }
        .steam { opacity: .3; }
      }
    ]]></style>
  </defs>

  <!-- Background -->
  <rect width="640" height="520" fill="url(#bg)" />
  <rect width="640" height="520" fill="url(#grid)" />

  <ellipse class="glow" cx="474" cy="252" rx="205" ry="170" fill="url(#glow)" />

  <!-- Floating glyphs -->
  <g transform="translate(76 96) scale(1.4)">
    <g class="float-a" fill="none" stroke="#22d3ee" stroke-opacity=".5" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M18 10h-1.26A8 8 0 1 0 9 20h9a5 5 0 0 0 0-10z" />
    </g>
  </g>

  <g transform="translate(278 88)">
    <g class="float-b" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="26" font-weight="600" fill="#60a5fa" fill-opacity=".55">
      <text x="0" y="0">&lt;/&gt;</text>
    </g>
  </g>

  <g transform="translate(552 96) scale(1.3)">
    <g class="float-c" fill="none" stroke="#a78bfa" stroke-opacity=".5" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="6" cy="6" r="3" />
      <circle cx="6" cy="18" r="3" />
      <circle cx="18" cy="6" r="3" />
      <path d="M6 9v6M18 9a6 6 0 0 1-6 6" />
    </g>
  </g>

  <g class="float-d" stroke="#22d3ee" stroke-opacity=".45" stroke-width="2" stroke-linecap="round">
    <path d="M330 58v12M324 64h12" />
  </g>
  <circle cx="611" cy="224" r="4" fill="#a78bfa" fill-opacity=".35" />

  <!-- Floor shadow -->
  <ellipse cx="332" cy="486" rx="238" ry="14" fill="#000" opacity=".3" />

  <!-- Chair -->
  <g>
    <rect x="144" y="232" width="22" height="150" rx="11" fill="#1b2b44" />
    <rect x="148" y="240" width="5" height="132" rx="2.5" fill="#2a4264" opacity=".8" />
    <rect x="156" y="364" width="102" height="16" rx="8" fill="#22344f" />
    <rect x="199" y="380" width="10" height="82" fill="#15243a" />
    <path d="M182 462h40" stroke="#15243a" stroke-width="6" stroke-linecap="round" />
    <circle cx="182" cy="466" r="7" fill="#15243a" />
    <circle cx="222" cy="466" r="7" fill="#15243a" />
  </g>

  <!-- Keyboard (drawn before the person so the hand rests on top) -->
  <g>
    <rect x="242" y="348" width="106" height="18" rx="5" fill="#223a5a" stroke="#4a7099" stroke-width="1.5" />
    <rect x="242" y="348" width="106" height="4" rx="2" fill="#33587f" />
    <path d="M250 355h82M250 360h82M250 365h58" stroke="#3a5f8a" stroke-width="1.5" stroke-linecap="round" />
  </g>

  <!-- Person -->
  <g class="person">
    <!-- back leg -->
    <path d="M198 374 L268 384 L278 450" fill="none" stroke="#1a2639" stroke-width="22" stroke-linecap="round" stroke-linejoin="round" />

    <!-- front leg -->
    <path d="M202 372 L276 380 L284 448" fill="none" stroke="#22314b" stroke-width="26" stroke-linecap="round" stroke-linejoin="round" />
    <rect x="266" y="440" width="50" height="17" rx="8.5" fill="#0d1626" />

    <!-- torso / hoodie -->
    <path d="M180 260 Q 168 300 171 340 L 170 378 Q 206 390 243 378 L 242 340 Q 245 300 232 260 Q 206 247 180 260 Z" fill="url(#hoodie)" />
    <path d="M186 258 Q 206 274 226 258" fill="none" stroke="#2a63cf" stroke-width="4" stroke-linecap="round" />

    <!-- arm reaching to keyboard -->
    <path d="M228 280 C 256 300 286 320 316 340" fill="none" stroke="#4f8ef7" stroke-width="19" stroke-linecap="round" />
    <path d="M301 330 L 312 338" stroke="#2a63cf" stroke-width="4" stroke-linecap="round" />
    <circle cx="318" cy="344" r="9.5" fill="#f2c39b" />

    <!-- head -->
    <circle cx="204" cy="218" r="32" fill="#f4c8a2" />
    <path d="M172 214 C 170 188 184 174 204 174 C 226 174 240 188 238 212 C 232 198 222 190 206 192 C 190 194 178 202 172 214 Z" fill="#1b2436" />
    <path d="M238 210 C 236 196 228 188 216 190 C 226 196 232 204 233 214 Z" fill="#1b2436" />

    <!-- headphones -->
    <path d="M174 210 C 174 174 234 174 234 210" fill="none" stroke="#22d3ee" stroke-width="6" stroke-linecap="round" />
    <rect x="228" y="200" width="14" height="30" rx="7" fill="#22d3ee" />
    <rect x="231" y="205" width="8" height="20" rx="4" fill="#0e7490" />

    <!-- face -->
    <circle cx="223" cy="217" r="2.6" fill="#101828" />
    <path d="M218 209 q6 -3 11 -1" fill="none" stroke="#1b2436" stroke-width="2" stroke-linecap="round" />
    <path d="M223 230 q6 5 12 1" fill="none" stroke="#c98f66" stroke-width="2.2" stroke-linecap="round" />
  </g>

  <!-- Monitor -->
  <g>
    <rect x="456" y="330" width="40" height="40" fill="#16233a" />
    <rect x="414" y="362" width="124" height="8" rx="4" fill="#22334f" />
    <rect x="352" y="148" width="244" height="182" rx="12" fill="#101c2f" stroke="#2b405f" stroke-width="2" />
    <rect x="362" y="158" width="224" height="162" rx="7" fill="#071120" />

    <!-- window chrome -->
    <circle cx="374" cy="172" r="3.5" fill="#ff5f57" />
    <circle cx="386" cy="172" r="3.5" fill="#febc2e" />
    <circle cx="398" cy="172" r="3.5" fill="#28c840" />
    <path d="M362 183h224" stroke="#122236" stroke-width="1" />

    <!-- code -->
    <rect class="code-line" x="374" y="194" width="68" height="6" rx="3" fill="#22d3ee" />
    <rect class="code-line" x="448" y="194" width="40" height="6" rx="3" fill="#334f74" />

    <rect class="code-line" x="374" y="210" width="26" height="6" rx="3" fill="#a78bfa" />
    <rect class="code-line" x="406" y="210" width="104" height="6" rx="3" fill="#2b4064" />

    <rect class="code-line" x="374" y="226" width="96" height="6" rx="3" fill="#34d399" fill-opacity=".85" />

    <rect class="code-line" x="374" y="242" width="44" height="6" rx="3" fill="#2b4064" />
    <rect class="code-line" x="424" y="242" width="88" height="6" rx="3" fill="#60a5fa" fill-opacity=".75" />

    <rect class="code-line" x="374" y="258" width="120" height="6" rx="3" fill="#2b4064" />

    <rect class="code-line" x="374" y="274" width="38" height="6" rx="3" fill="#f472b6" fill-opacity=".8" />
    <rect class="cursor" x="420" y="272" width="3" height="10" fill="#22d3ee" />
  </g>

  <!-- Desk -->
  <g>
    <rect x="64" y="368" width="524" height="14" rx="7" fill="#1d2c45" />
    <rect x="64" y="368" width="524" height="4" rx="2" fill="#33486a" opacity=".9" />
    <rect x="100" y="382" width="11" height="88" rx="5.5" fill="#16233a" />
    <rect x="542" y="382" width="11" height="88" rx="5.5" fill="#16233a" />
    <ellipse cx="474" cy="368" rx="96" ry="6" fill="#22d3ee" opacity=".08" />
  </g>

  <!-- Mug -->
  <g>
    <path class="steam" d="M92 326 C 88 320 92 314 90 308" fill="none" stroke="#8fa3c2" stroke-width="2" stroke-linecap="round" />
    <path class="steam" d="M106 328 C 102 322 106 316 104 310" fill="none" stroke="#8fa3c2" stroke-width="2" stroke-linecap="round" />
    <rect x="84" y="330" width="30" height="38" rx="6" fill="#26405f" stroke="#3b5b83" stroke-width="1.5" />
    <rect x="86" y="332" width="26" height="3" rx="1.5" fill="#3b5b83" />
    <path d="M114 338h5a8 8 0 0 1 0 16h-5" fill="none" stroke="#3b5b83" stroke-width="3" />
  </g>

  <!-- Plant -->
  <g>
    <path d="M565 328 C 565 306 556 294 544 288" fill="none" stroke="#2fbf8f" stroke-width="3" stroke-linecap="round" />
    <ellipse cx="540" cy="285" rx="10" ry="5.5" fill="#34d399" fill-opacity=".9" transform="rotate(-30 540 285)" />
    <path d="M565 328 C 566 302 574 292 586 286" fill="none" stroke="#2fbf8f" stroke-width="3" stroke-linecap="round" />
    <ellipse cx="590" cy="284" rx="9" ry="5" fill="#2fbf8f" transform="rotate(35 590 284)" />
    <path d="M565 328 L 565 298" fill="none" stroke="#2fbf8f" stroke-width="3" stroke-linecap="round" />
    <ellipse cx="565" cy="292" rx="5" ry="9" fill="#34d399" fill-opacity=".8" />
    <rect x="544" y="328" width="42" height="7" rx="3.5" fill="#22344f" />
    <rect x="548" y="333" width="34" height="35" rx="6" fill="#17263d" stroke="#2c4162" stroke-width="1.5" />
  </g>
</svg>
